<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Flower Light Room — 電球でできた花</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;height:100%;width:100%;font-family:'Helvetica Neue',Arial,sans-serif;}
  canvas{display:block;}
  #ui{
    position:fixed; top:0; left:0; width:300px; max-height:100vh; overflow-y:auto;
    background:rgba(6,6,10,0.72); color:#f0e8ff; padding:16px 18px; box-sizing:border-box;
    backdrop-filter:blur(6px); font-size:12px; z-index:10; transition:opacity .3s, transform .3s;
    border-right:1px solid rgba(255,180,230,0.15);
  }
  #ui.hidden{opacity:0; transform:translateX(-100%); pointer-events:none;}
  #ui h1{font-size:14px; margin:0 0 4px; letter-spacing:.04em; color:#ffb0e0; font-weight:600;}
  #ui p.sub{margin:0 0 14px; opacity:.6; font-size:11px; line-height:1.6;}
  .row{margin-bottom:12px;}
  .row label{display:flex; justify-content:space-between; margin-bottom:4px; opacity:.85;}
  .row input[type=range]{width:100%; accent-color:#ff9fd8;}
  select{width:100%; background:#1a1420; color:#f0e0ff; border:1px solid #4a3050; border-radius:4px; padding:6px; font-size:11px; margin-bottom:10px;}
  #hint{
    position:fixed; bottom:14px; left:14px; color:rgba(255,255,255,.35); font-size:11px; z-index:10;
    transition:opacity .3s;
  }
  #hint.hidden{opacity:0;}
  #menuBtn{
    display:none; position:fixed; top:14px; left:14px; z-index:20;
    width:40px; height:40px; border-radius:8px; border:1px solid rgba(255,180,230,0.25);
    background:rgba(6,6,10,0.72); backdrop-filter:blur(6px); color:#ffb0e0;
    font-size:18px; line-height:1; cursor:pointer;
  }
  @media (max-width: 768px){
    #menuBtn{ display:block; }
    #ui{ width:min(300px, 86vw); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="menuBtn" aria-label="設定を開く">&#9776;</button>

<div id="ui">
  <h1>FLOWER LIGHT ROOM</h1>
  <p class="sub">花の輪郭を、面ではなく無数の小さな電球(発光点)で構成しています。実際の展示でLED球を花の形に並べて発光させるイメージに近づけたバージョンです。</p>

  <select id="palette">
    <option value="uv">UVフローラル(ピンク×紫×ティール)</option>
    <option value="warm">ゴールド×アンバー</option>
    <option value="cool">ディープブルー×シアン</option>
  </select>

  <div class="row">
    <label><span>花の数</span><span id="vCount">30</span></label>
    <input type="range" id="count" min="6" max="60" value="30">
  </div>
  <div class="row">
    <label><span>電球の密度(花あたりの数)</span><span id="vBulbs">18</span></label>
    <input type="range" id="bulbs" min="3" max="60" value="18">
  </div>
  <div class="row">
    <label><span>電球の大きさ(点描の細かさ)</span><span id="vSize">0.35</span></label>
    <input type="range" id="size" min="0.1" max="2.0" step="0.02" value="0.35">
  </div>
  <div class="row">
    <label><span>発光の強さ</span><span id="vGlow">0.4</span></label>
    <input type="range" id="glow" min="0.2" max="2.2" step="0.05" value="0.4">
  </div>
  <div class="row">
    <label><span>電球のまたたき</span><span id="vTwinkle">0.5</span></label>
    <input type="range" id="twinkle" min="0" max="1" step="0.02" value="0.5">
  </div>
  <div class="row">
    <label><span>周囲へのにじみ(アンビエント)</span><span id="vHaze">0.25</span></label>
    <input type="range" id="haze" min="0" max="1" step="0.02" value="0.25">
  </div>
  <div class="row">
    <label><span>カメラ移動速度</span><span id="vSpeed">0.5</span></label>
    <input type="range" id="speed" min="0.05" max="1.5" step="0.01" value="0.5">
  </div>
  <div class="row">
    <label><span>浮遊する光の粒子</span><span id="vDust">1.0</span></label>
    <input type="range" id="dust" min="0" max="2" step="0.05" value="1.0">
  </div>
  <div class="row">
    <label><span>床の反射</span><span id="vRefl">0.4</span></label>
    <input type="range" id="refl" min="0" max="1" step="0.02" value="0.4">
  </div>
</div>

<div id="hint">H キーでUIの表示/非表示 &nbsp;|&nbsp; 画面録画してループ映像に</div>

<script>
// run immediately (before the heavy three.js library loads) so the panel
// starts collapsed on mobile with no flash/delay
(function(){
  if(window.matchMedia('(max-width: 768px)').matches){
    document.getElementById('ui').classList.add('hidden');
    document.getElementById('hint').classList.add('hidden');
  }
})();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.045);
const camera = new THREE.PerspectiveCamera(58, window.innerWidth/window.innerHeight, 0.1, 200);

// palette = [colorA, colorB, accent(sparkle), core(stamen/gold)]
const PALETTES = {
  uv:   { a:0xff6fd8, b:0x8a6bff, accent:0x6ee7d8, core:0xffe08a },
  warm: { a:0xffb347, b:0xff5f6d, accent:0xffe9a8, core:0xfff2c2 },
  cool: { a:0x3ddbff, b:0x5a7bff, accent:0x8affe0, core:0xffffff },
};

function makeGlowTexture(){
  const s = 128;
  const cv = document.createElement('canvas'); cv.width=cv.height=s;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0, 'rgba(255,255,255,1)');
  g.addColorStop(0.35, 'rgba(255,255,255,0.7)');
  g.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(cv);
}
const glowTex = makeGlowTexture();

function petalWidthProfile(u){
  return Math.pow(Math.sin(Math.PI*Math.min(Math.max(u,0.001),0.999)), 0.55);
}

// ---- custom shader material for individual light-bulb points ----
const bulbVert = `
attribute vec3 color;
attribute float seed;
attribute float baseSize;
uniform float uTime, uGlow, uTwinkle, uSizeMult;
varying vec3 vColor;
void main(){
  vColor = color;
  vec4 mv = modelViewMatrix * vec4(position, 1.0);
  float tw = mix(1.0, 0.55 + 0.45*sin(uTime*1.4 + seed*6.2831), uTwinkle);
  gl_PointSize = baseSize * uSizeMult * tw * uGlow * (300.0 / -mv.z);
  gl_Position = projectionMatrix * mv;
}`;
const bulbFrag = `
precision mediump float;
varying vec3 vColor;
void main(){
  vec2 uv = gl_PointCoord - 0.5;
  float d = length(uv) * 2.0;
  float alpha = pow(smoothstep(1.0, 0.0, d), 1.6);
  float core = smoothstep(0.35, 0.0, d);
  vec3 col = vColor + core*0.65;
  gl_FragColor = vec4(col, alpha);
}`;

function buildBulbFlower(palette, scale){
  const petals = 6 + Math.floor(Math.random()*3);
  const bulbsPerPetal = window.__bulbsPerPetal || 10;
  const L = 1.15, maxWidth = 0.34;

  const positions = [], colors = [], seeds = [], sizes = [];
  const colA = new THREE.Color(palette.a), colB = new THREE.Color(palette.b);
  const accent = new THREE.Color(palette.accent), core = new THREE.Color(palette.core);

  for(let p=0; p<petals; p++){
    const a = (p/petals)*Math.PI*2;
    const cosA = Math.cos(a), sinA = Math.sin(a);
    const n = bulbsPerPetal;
    for(let i=0;i<n;i++){
      let u = (i + 0.15 + Math.random()*0.7) / n;
      u = Math.min(Math.max(u, 0.03), 0.98);
      const wmax = maxWidth * petalWidthProfile(u);
      const v = (Math.random()*2-1) * wmax;
      const px = v, py = u*L;
      const x = (px*cosA - py*sinA) * scale;
      const y = (px*sinA + py*cosA) * scale;
      const z = Math.sin(u*Math.PI) * 0.22 * scale * (0.6+0.5*Math.random());
      positions.push(x,y,z);

      let c = colA.clone().lerp(colB, u);
      if(Math.random() < 0.12) c = accent.clone();
      const b = 0.8 + Math.random()*0.4;
      c.multiplyScalar(b);
      colors.push(c.r, c.g, c.b);
      seeds.push(Math.random()*100);
      sizes.push((5 + Math.random()*4) * (0.7+0.3*scale));
    }
  }
  // stamen / pollen cluster at center
  const centerN = 10 + Math.floor(Math.random()*8);
  for(let i=0;i<centerN;i++){
    const r = Math.random()*0.09*scale;
    const ang = Math.random()*Math.PI*2;
    positions.push(Math.cos(ang)*r, Math.sin(ang)*r, 0.06*scale + Math.random()*0.03*scale);
    const c = core.clone().multiplyScalar(0.9+Math.random()*0.4);
    colors.push(c.r,c.g,c.b);
    seeds.push(Math.random()*100);
    sizes.push((6+Math.random()*5)*(0.7+0.3*scale));
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors,3));
  geo.setAttribute('seed', new THREE.Float32BufferAttribute(seeds,1));
  geo.setAttribute('baseSize', new THREE.Float32BufferAttribute(sizes,1));

  const mat = new THREE.ShaderMaterial({
    vertexShader: bulbVert, fragmentShader: bulbFrag,
    uniforms: { uTime:{value:0}, uGlow:{value:1.0}, uTwinkle:{value:0.5}, uSizeMult:{value:0.35} },
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
  });

  const points = new THREE.Points(geo, mat);

  // faint ambient haze sprite behind the bulbs
  const hazeMat = new THREE.SpriteMaterial({
    map: glowTex, color: colA.clone().lerp(colB,0.5), transparent:true,
    opacity: 0.25, blending:THREE.AdditiveBlending, depthWrite:false,
  });
  const haze = new THREE.Sprite(hazeMat);
  haze.scale.setScalar(2.6*scale);

  const group = new THREE.Group();
  group.add(haze);
  group.add(points);
  group.userData.bulbMat = mat;
  group.userData.hazeMat = hazeMat;
  group.userData.spinSpeed = (Math.random()-0.5)*0.06;
  return group;
}

let flowerGroup = new THREE.Group();
scene.add(flowerGroup);
let flowers = [];
let allBulbMats = [];
let allHazeMats = [];

function buildFlowers(count, paletteKey, bulbsPerPetal){
  window.__bulbsPerPetal = bulbsPerPetal;
  scene.remove(flowerGroup);
  flowerGroup = new THREE.Group();
  flowers = []; allBulbMats = []; allHazeMats = [];
  const palette = PALETTES[paletteKey];
  for(let i=0;i<count;i++){
    const scale = 0.7 + Math.random()*1.7;
    const f = buildBulbFlower(palette, scale);
    const radius = 3 + Math.random()*14;
    const theta = Math.random()*Math.PI*2;
    const y = -1 + Math.random()*9;
    f.position.set(Math.cos(theta)*radius, y, Math.sin(theta)*radius);
    f.rotation.set((Math.random()-0.5)*0.6, Math.random()*Math.PI*2, (Math.random()-0.5)*0.6);
    f.userData.phase = Math.random()*Math.PI*2;
    flowerGroup.add(f);
    flowers.push(f);
    allBulbMats.push(f.userData.bulbMat);
    allHazeMats.push(f.userData.hazeMat);
  }
  scene.add(flowerGroup);
}
buildFlowers(30, 'uv', 18);

// ---- floor ----
const floorGeo = new THREE.PlaneGeometry(200,200);
const floorMat = new THREE.MeshStandardMaterial({ color:0x050508, roughness:0.36, metalness:0.85 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = -1.2;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0x8899ff, 0x000000, 0.15);
scene.add(hemi);
const amb = new THREE.AmbientLight(0x201025, 0.4);
scene.add(amb);

// mirrored duplicate for cheap floor reflection
const reflectionGroup = new THREE.Group();
scene.add(reflectionGroup);
function rebuildReflection(){
  reflectionGroup.clear();
  flowers.forEach(f=>{
    const clone = f.clone(true);
    clone.traverse(o=>{
      if(o.material){
        o.material = o.material.clone();
        if(o.material.uniforms){
          if(!allBulbMats.includes(o.material)) allBulbMats.push(o.material);
        } else if(o.isSprite){
          if(!allHazeMats.includes(o.material)) allHazeMats.push(o.material);
        }
      }
    });
    reflectionGroup.add(clone);
  });
  reflectionGroup.scale.y = -1;
  reflectionGroup.position.y = -2.4;
}
rebuildReflection();

// ---- floating light dust ----
let dustPoints;
function buildDust(density){
  if(dustPoints) scene.remove(dustPoints);
  const n = Math.floor(400*density);
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    pos[i*3] = (Math.random()-0.5)*36;
    pos[i*3+1] = Math.random()*10 - 1;
    pos[i*3+2] = (Math.random()-0.5)*36;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({
    size:0.12, map:glowTex, color:0xffe6f7, transparent:true, opacity:0.55,
    blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true,
  });
  dustPoints = new THREE.Points(geo, mat);
  scene.add(dustPoints);
}
buildDust(1.0);

function cameraPath(t){
  const ang = t*Math.PI*2;
  const radius = 8.5 + Math.sin(ang*2.0)*2.2;
  return new THREE.Vector3(Math.cos(ang)*radius, 2.0+Math.sin(ang*3.0)*1.1, Math.sin(ang)*radius);
}
function lookTarget(t){
  const ang = t*Math.PI*2 + 0.6;
  return new THREE.Vector3(Math.cos(ang)*3.0, 2.2+Math.sin(ang*1.5)*1.0, Math.sin(ang)*3.0);
}

let params = { speed:0.5, glow:0.4, twinkle:0.5, haze:0.25, sizeMult:0.35 };

const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const t = clock.elapsedTime;

  const loopT = (t*0.02*params.speed) % 1.0;
  camera.position.copy(cameraPath(loopT));
  camera.lookAt(lookTarget(loopT));

  allBulbMats.forEach(m=>{
    m.uniforms.uTime.value = t;
    m.uniforms.uGlow.value = params.glow;
    m.uniforms.uTwinkle.value = params.twinkle;
    m.uniforms.uSizeMult.value = params.sizeMult;
  });
  allHazeMats.forEach(m=>{
    m.opacity = params.haze * (0.75 + 0.25*Math.sin(t*0.6));
  });
  flowers.forEach(f=> f.rotation.y += dt*f.userData.spinSpeed*0.3 );

  if(dustPoints){
    dustPoints.rotation.y += dt*0.01;
    const pos = dustPoints.geometry.attributes.position;
    for(let i=0;i<pos.count;i++){
      const y = pos.getY(i) + dt*0.15;
      pos.setY(i, y>9 ? -1 : y);
    }
    pos.needsUpdate = true;
  }

  renderer.render(scene, camera);
}
animate();

function resize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', resize);

function rebuildAll(){
  const count = parseInt(document.getElementById('count').value);
  const bulbs = parseInt(document.getElementById('bulbs').value);
  const pal = document.getElementById('palette').value;
  buildFlowers(count, pal, bulbs);
  rebuildReflection();
}
document.getElementById('palette').addEventListener('change', rebuildAll);
document.getElementById('count').addEventListener('input', (e)=>{ document.getElementById('vCount').textContent = e.target.value; rebuildAll(); });
document.getElementById('bulbs').addEventListener('input', (e)=>{ document.getElementById('vBulbs').textContent = e.target.value; rebuildAll(); });
document.getElementById('size').addEventListener('input', (e)=>{ params.sizeMult = parseFloat(e.target.value); document.getElementById('vSize').textContent = e.target.value; });
document.getElementById('glow').addEventListener('input', (e)=>{ params.glow = parseFloat(e.target.value); document.getElementById('vGlow').textContent = e.target.value; });
document.getElementById('twinkle').addEventListener('input', (e)=>{ params.twinkle = parseFloat(e.target.value); document.getElementById('vTwinkle').textContent = e.target.value; });
document.getElementById('haze').addEventListener('input', (e)=>{ params.haze = parseFloat(e.target.value); document.getElementById('vHaze').textContent = e.target.value; });
document.getElementById('speed').addEventListener('input', (e)=>{ params.speed = parseFloat(e.target.value); document.getElementById('vSpeed').textContent = e.target.value; });
document.getElementById('dust').addEventListener('input', (e)=>{ buildDust(parseFloat(e.target.value)); document.getElementById('vDust').textContent = e.target.value; });
document.getElementById('refl').addEventListener('input', (e)=>{
  const v = parseFloat(e.target.value);
  reflectionGroup.visible = v>0.02;
  floorMat.roughness = 0.5 - v*0.35;
  document.getElementById('vRefl').textContent = e.target.value;
});

// state was already applied by the early inline script above (before three.js loaded)
let uiHidden = document.getElementById('ui').classList.contains('hidden');
function setUiHidden(hidden){
  uiHidden = hidden;
  document.getElementById('ui').classList.toggle('hidden', uiHidden);
  document.getElementById('hint').classList.toggle('hidden', uiHidden);
}

window.addEventListener('keydown', (e)=>{
  if(e.key.toLowerCase()==='h') setUiHidden(!uiHidden);
});
document.getElementById('menuBtn').addEventListener('click', ()=> setUiHidden(!uiHidden));
</script>
</body>
</html>
